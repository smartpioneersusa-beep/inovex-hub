<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INOVEX Hub</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="INOVEX Hub">
<style>
  html,body{margin:0;min-height:100%;background:#121212;color:#fff;font:15px/1.5 Inter,'Segoe UI',Roboto,Tahoma,Arial,sans-serif}
  body{display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px;box-sizing:border-box}
  .card{background:#fff;color:#16181B;border-radius:16px;padding:28px;max-width:380px;width:100%;box-shadow:0 20px 50px #0008;border-top:4px solid #C9A227}
  img{width:84px;height:84px;border-radius:18px}
  .brand{color:#86690C;font-weight:700;letter-spacing:3px;font-size:12px;margin-top:12px}
  h1{font-size:20px;margin:6px 0 4px}p{color:#5A5F67;margin:0 0 16px;font-size:13.5px}
  .btn{display:block;width:100%;box-sizing:border-box;margin-top:10px;padding:12px 16px;border-radius:9px;background:#C9A227;color:#121212;font-weight:700;text-decoration:none;border:0;font-size:15px;cursor:pointer}
  .small{font-size:12px;color:#8a97a8;margin-top:16px}.small a{color:#86690C}
  .spin{width:26px;height:26px;border:3px solid #e3e8ef;border-top-color:#C9A227;border-radius:50%;animation:sp .9s linear infinite;margin:18px auto 10px}
  @keyframes sp{to{transform:rotate(360deg)}}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="card">
  <img src="./icons/icon-192.png" alt="INOVEX">
  <div class="brand">INOVEX GROUP LLC</div>
  <h1 id="t">INOVEX Hub</h1>
  <p id="sub">All company systems in one place – INOVEX staff only</p>
  <a class="btn" id="go" href="#">Sign in with your INOVEX Google account</a>
  <div id="wait" hidden><div class="spin"></div><div id="msg">Opening…</div></div>
  <p class="small"><a href="#" id="lang">العربية</a></p>
</div>
<script src="./config.js"></script>
<script>
(function () {
  var C = window.HUB_CONFIG, $ = function (i) { return document.getElementById(i); };
  var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  var AR = { t: 'بوابة إنوفكس', sub: 'جميع أنظمة الشركة في مكان واحد – لموظفي إنوفكس فقط', go: 'الدخول بحساب Google الخاص بإنوفكس', msg: 'جارٍ الفتح…', lang: 'English' };
  var EN = {}; Object.keys(AR).forEach(function (k) { EN[k] = $(k).textContent; });
  function lang(l) { var T = l === 'ar' ? AR : EN; document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'; Object.keys(T).forEach(function (k) { $(k).textContent = T[k]; }); set('hub-lang', l); }
  lang(get('hub-lang') || (/^ar/i.test(navigator.language) ? 'ar' : 'en'));
  $('lang').onclick = function (e) { e.preventDefault(); lang(document.documentElement.lang === 'ar' ? 'en' : 'ar'); };
  $('go').onclick = function (e) { e.preventDefault(); $('go').hidden = true; $('wait').hidden = false; location.replace(C.staffUrl); };
})();
</script>
</body>
</html>
